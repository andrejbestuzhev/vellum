name: vault-deploy

# The vault build goes to production on every push to the vault branch:
# tests here, then the server checks the commit out and rebuilds
# (scripts/vault-deploy.sh). No tags involved. docs/deploy.md has the setup.
# No workflow_dispatch: GitHub offers it only for workflows on the default
# branch, which in this fork mirrors upstream. Re-run a run to redeploy.
on:
  push:
    branches: [vault]

concurrency:
  group: vault-deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The image (SPA + binary) is built on the server: a few minutes.
    timeout-minutes: 30
    steps:
      - name: Deploy on the server
        uses: appleboy/ssh-action@v1
        env:
          REF: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Host key fingerprint: no match, no connection.
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: REF
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/apps/vault-mcp
            git fetch origin --prune --force
            git checkout --force --detach "$REF"
            ./scripts/vault-deploy.sh "$(git rev-parse --short HEAD)"
